services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: pdf-tra-cloud
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PDF_TRA_CONFIG: /data/config.json
      PDF_TRA_UPLOAD_DIR: /data/uploads
      PDF_TRA_PORT: "8787"
    volumes:
      - ./data/config.json:/data/config.json:ro
      - ./data/uploads:/data/uploads
    ports:
      - "127.0.0.1:8787:8787"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  nginx:
    image: nginx:1.27-alpine
    container_name: pdf-tra-nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # 生产 HTTPS：挂载 certbot 证书后取消下行注释并启用 nginx/ssl.conf
      # - ./nginx/ssl.conf:/etc/nginx/conf.d/ssl.conf:ro
      # - /etc/letsencrypt:/etc/letsencrypt:ro
